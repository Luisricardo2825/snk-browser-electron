name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@v3

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Clean install
        run: |
          pnpm ci

      - name: pnpm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run package
          pnpm run lint
          pnpm exec tsc --noEmit
          pnpm test

      - name: Verify Electron startup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm run test:smoke

      - name: Verify Electron startup (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm run test:smoke
